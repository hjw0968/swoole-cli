name: build-swoole-cli-macos-aarch64

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/scripts/publish-verified-release.sh'
      - '.github/scripts/test-release-version-policy.sh'
      - '.github/scripts/sync-upstream.sh'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/sync-upstream.yml'
      - '.github/workflows/prune-action-runs-once.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/scripts/publish-verified-release.sh'
      - '.github/scripts/test-release-version-policy.sh'
      - '.github/scripts/sync-upstream.sh'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/sync-upstream.yml'
      - '.github/workflows/prune-action-runs-once.yml'
  workflow_dispatch:

jobs:
  macos-aarch64:
    if: ${{ !contains(github.event.head_commit.message, '--filter=') || contains(github.event.head_commit.message, '[macos-aarch64]') }}
    runs-on: macos-15
    # macos-latest (macos-14)  变更了 CPU 架构，由 x86_64 变更为 arm64
    # macos-14 CPU 架构 arm64
    # macos-13 CPU 架构 x86_64
    # macos-12 CPU 架构 x86_64
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#choosing-github-hosted-runners

    steps:
      - uses: actions/checkout@v5
      - name: Show Environment Info
        run: |
          set -x
          uname -s
          uname -m
          uname -r
          env
          echo $HOME
          sw_vers
          xcodebuild -version
          brew config
          xcrun --show-sdk-path
          ls -lh $(xcrun --show-sdk-path)

          ifconfig
          export IPV6=$(ifconfig en0  | grep "inet6 " | grep -v "inet6 fe80:" | awk '{print $2}' | cut -d'/' -f1 | sed -n '2p')
          export IPV4=$(ifconfig en0 | grep "inet " | grep -v 127.0.0 | awk '{print $2}' | cut -d'/' -f1 | sed -n '1p')
          echo $IPV4
          echo $IPV6
          echo "X_IPV6=${IPV6}" >> $GITHUB_ENV
          echo "X_IPV4=${IPV4}" >> $GITHUB_ENV

      - name: Prepare Build Environment
        run: |
          bash sapi/quickstart/macos/macos-init.sh

          export PATH="/opt/homebrew/opt/libtool/bin:$PATH"
          ls -lha /opt/homebrew/opt/libtool/bin/
          libtoolize --version
          libtool --help-all

          # brew bison --debug

          CURRENT_USER=$(whoami)
          echo ${CURRENT_USER}
          sudo mkdir -p /usr/local/swoole-cli
          CURRENT_USER=$(whoami) && sudo chown -R ${CURRENT_USER}:staff /usr/local/swoole-cli

          git submodule update --init

      - name: Cache PHP Runtime
        uses: actions/cache@v5
        id: php-runtime-cache
        with:
          path: ${{ github.workspace }}/var/runtime
          key: ${{ runner.os }}-aarch64-php-runtime

      - name: Cache PHP Vendor
        uses: actions/cache@v5
        id: php-vendor-cache
        with:
          path: ${{ github.workspace }}/vendor
          key: ${{ runner.os }}-aarch64-php-vendor

      - name: Cache Dependency Source Code Tarball
        uses: actions/cache@v5
        id: pool-cache
        with:
          path: ${{ github.workspace }}/pool/
          key: source-code-tarball-pool

      - name: Cache all-library
        uses: actions/cache@v5
        id: all-library-cache
        with:
          path: /usr/local/swoole-cli
          key: all-library-${{ runner.os }}-aarch64-${{ hashFiles('sapi/PHP-VERSION.conf', 'sapi/SWOOLE-VERSION.conf') }}
          restore-keys: |
            all-library-${{ runner.os }}-aarch64-

      - name: Prepare Runtime and Libraries and Extensions
        run: |
          set -ex
          mkdir -p pool/lib
          mkdir -p pool/ext
          mkdir -p bin/
          mkdir -p var/runtime/
          if [ ! -f var/runtime/php/box ] ; then
              bash  setup-php-runtime.sh
          fi
          bash sapi/download-box/download-box-get-archive-from-server.sh
          ls -A pool/lib/
          ls -A /usr/local/swoole-cli/

      - name: prepare
        run: |
          export PATH=${{ github.workspace }}/var/runtime/php/:$PATH
          alias php="php -d curl.cainfo=${{ github.workspace }}/var/runtime/php/cacert.pem -d openssl.cafile=${{ github.workspace }}/var/runtime/php/cacert.pem"

          composer install  --no-interaction --no-autoloader --no-scripts --profile
          composer dump-autoload --optimize --profile

          php prepare.php --without-docker=1 --with-libavif +protobuf +xlswriter

      - name: Isolate xlswriter 3 bundled minizip headers
        run: |
          export PATH=${{ github.workspace }}/var/runtime/php/:$PATH
          php sapi/scripts/patch-xlswriter3-headers.php

      - name: Build
        run: |
          export PATH=${{ github.workspace }}/var/runtime/php/:$PATH

          bash make.sh all-library

          bash make.sh config
          test -f ext/protobuf/php_protobuf.h
          grep -q 'phpext_protobuf_ptr' ext/protobuf/php_protobuf.h
          grep -q '#include "ext/protobuf/php_protobuf.h"' main/internal_functions_cli.c
          bash make.sh build
          bash make.sh archive

      - name: Cache compiled libraries on failure
        if: ${{ failure() && steps.all-library-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: /usr/local/swoole-cli
          key: all-library-${{ runner.os }}-aarch64-${{ hashFiles('sapi/PHP-VERSION.conf', 'sapi/SWOOLE-VERSION.conf') }}

      - name: Show Build Result
        run: |
          ./bin/swoole-cli -v
          ./bin/swoole-cli -m
          ./bin/swoole-cli --ri curl
          ./bin/swoole-cli --ri gd
          ./bin/swoole-cli --ri imagick
          ./bin/swoole-cli --ri swoole
          file ./bin/swoole-cli
          otool -L ./bin/swoole-cli
          APP_VERSION=$(./bin/swoole-cli  -v | awk '{print $2}')
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          ./bin/swoole-cli -r "echo PHP_VERSION;"
          ./bin/swoole-cli ./vendor/bin/phpunit ./sapi/src/UnitTest/MainTest.php  --list-tests
          ./bin/swoole-cli ./vendor/bin/phpunit ./sapi/src/UnitTest/MainTest.php

      - name: Verify Required Extensions
        run: |
          ./bin/swoole-cli --ri protobuf
          ./bin/swoole-cli --ri xlswriter
          ./bin/swoole-cli -r '
            foreach (["protobuf", "xlswriter"] as $ext) {
                if (!extension_loaded($ext)) {
                    fwrite(STDERR, "Missing extension: {$ext}\\n");
                    exit(1);
                }
            }
            echo "Required extensions OK\\n";
          '

      - name: Archive production artifacts debug
        uses: actions/upload-artifact@v5
        with:
          name: swoole-cli-v${{ env.APP_VERSION }}-macos-arm64-debug
          retention-days: 90
          path: ./bin/swoole-cli

      - name: Archive production artifacts
        uses: actions/upload-artifact@v5
        with:
          name: swoole-cli-v${{ env.APP_VERSION }}-macos-arm64
          retention-days: 90
          path: ./bin/dist/swoole-cli


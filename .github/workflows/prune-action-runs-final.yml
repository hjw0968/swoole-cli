name: Final one-time retry for obsolete GitHub Actions runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-action-runs-final.yml'

permissions:
  contents: write
  actions: write

jobs:
  prune:
    if: ${{ github.repository == 'hjw0968/swoole-cli' && contains(github.event.head_commit.message, '--filter=cleanup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Retry only four obsolete failed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh release view v6.2.2-php8.4.25-gaea986c -R "$repo" >/dev/null
          gh release view v6.2.4-php8.4.27-g9ae5527 -R "$repo" >/dev/null
          errors=0
          for id in 41070969998 41071386818 39902057471 39897344016; do
            removed=0
            for attempt in 1 2 3 4; do
              echo "Deleting obsolete run $id (attempt $attempt)"
              if gh api -X DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1; then
                removed=1
                break
              fi
              sleep "$((attempt * 4))"
            done
            if (( removed == 1 )); then
              echo "Deleted run $id"
            else
              echo "::warning::GitHub API still refuses to delete run $id"
              ((errors+=1))
            fi
          done
          echo "Remaining API delete failures: $errors"
      - name: Remove temporary workflow regardless of GitHub API errors
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- .github/workflows/prune-action-runs-final.yml
          git commit -m 'chore: finish and remove temporary history cleaner --filter=cleanup'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 4))"
          done
          exit 1

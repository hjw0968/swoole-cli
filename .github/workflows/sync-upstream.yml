name: Sync official upstream (verified)

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: verified-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge upstream only after both platform builds pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/sync-upstream.sh
